<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Chromavox</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="left-panel" class="panel">
    <h2>Emitters</h2>
    <div class="row"><label>Sources <input id="emitter-count" type="range" min="1" max="128" value="12"><span id="emitter-count-val">12</span></label></div>
    <div class="row"><label>λ min (nm) <input id="wl-min" type="range" min="380" max="780" value="400"><span id="wl-min-val">400</span></label></div>
    <div class="row"><label>λ max (nm) <input id="wl-max" type="range" min="380" max="780" value="700"><span id="wl-max-val">700</span></label></div>
    <div class="row"><label>Rays/source <input id="rays-per" type="range" min="1" max="2000" value="512"><span id="rays-per-val">512</span></label></div>
    <div class="row"><label>Spread° <input id="spread" type="range" min="0" max="60" value="0"><span id="spread-val">0</span></label></div>
    <div class="row"><label>Aperture <input id="aperture" type="range" min="0" max="100" value="1"><span id="aperture-val">0.01</span></label></div>
    <div class="row"><button id="mic-toggle">Audio in: off</button></div>
    <div class="row"><label>Source <select id="mic-source"><option value="mic">microphone</option><option value="sine">sine 440</option><option value="harmonics">harmonics 220</option><option value="white">white noise</option><option value="pink">pink noise</option><option value="keyboard">keyboard</option></select></label></div>
    <div class="row"><label>Mode <select id="mic-mode"><option value="log">log</option><option value="chromatic" selected>chromatic</option></select></label></div>
    <div class="row"><label>Base <select id="mic-base">
      <option value="32.70">C1</option>
      <option value="65.41">C2</option>
      <option value="87.31">F2</option>
      <option value="110">A2</option>
      <option value="130.81" selected>C3</option>
      <option value="174.61">F3</option>
      <option value="220">A3</option>
      <option value="261.63">C4</option>
      <option value="440">A4</option>
      <option value="523.25">C5</option>
      <option value="1046.5">C6</option>
      <option value="2093">C7</option>
    </select></label></div>
    <div class="row"><label><input id="bucket-color" type="checkbox"> Bucket color</label></div>
    <h2>Sensors</h2>
    <div class="row"><label>Count <input id="sensor-count" type="range" min="1" max="64" value="12"><span id="sensor-count-val">12</span></label></div>
    <div class="row"><label><input id="sensor-sync" type="checkbox"> Sync to source count</label></div>
    <div class="row"><button id="synth-toggle">Audio out: off</button></div>
    <div class="row"><label>Volume <input id="synth-vol" type="range" min="0" max="100" value="25"><span id="synth-vol-val">25</span></label></div>
    <h2>Tools</h2>
    <div class="tools">
      <button data-tool="prism">Prism</button>
      <button data-tool="block">Block</button>
      <button data-tool="lens-convex">Convex Lens</button>
      <button data-tool="lens-concave">Concave Lens</button>
      <button data-tool="mirror">Mirror</button>
      <button data-tool="rabbit">Rabbit</button>
      <button data-tool="select" class="active">Select</button>
      <button data-tool="delete">Delete</button>
    </div>
    <h2>Selected</h2>
    <div id="prop-panel"><em>No selection</em></div>
    <h2>Scene</h2>
    <div class="row">
      <label>Preset <select id="preset-select"><option value="">…</option></select></label>
    </div>
    <div class="row">
      <button id="save">Save JSON</button>
      <button id="load">Load JSON</button>
      <button id="clear">Clear</button>
    </div>
    <input id="file-input" type="file" accept="application/json" hidden>
  </aside>

  <main id="stage">
    <canvas id="gl"></canvas>
  </main>

  <aside id="right-panel" class="panel">
    <div id="sensor-readout"></div>
  </aside>

  <button id="panel-toggle" aria-label="Toggle panels">☰</button>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
